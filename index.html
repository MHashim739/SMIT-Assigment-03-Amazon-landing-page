<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Landing Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-logo boeder-white">
      <div class="logo"></div>
    </div>

    <div class="nav-address border-white">
      <p class="add-first">Deliver to</p>
      <div class="add-icon">
        <i class="fa-solid fa-location-dot"></i>
        <p class="add-second">pakistan</p>
      </div>
    </div>

    <div class="nav-search">
      <select class="search-select">
        <option >ALL</option>
        <option value=""></option>
      </select>
      <input type="text" placeholder="Search Amazon" class="search-input">
      <div class="search-icon">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
    </div>

    <div class="nav-lang border-white">
      <img height="30px" width="50px" src="./images/download.jpg" alt="">
      <div class="flag-icon">US</div>
      <p class="lang-text">EN</p>
      <i class="fa-solid fa-caret-down dropdown-icon"></i>
      </div>

      <div class="nav-signin border-white">
            <p class="nav-line-1">Hello, sign in</p>
            <p class="nav-line-2">Account & Lists <i class="fa-solid fa-caret-down"></i></p>
        </div>
    </div>

    <div class="nav-orders border-white">
      <p class="nav-line-1">Returns</p>
      <p class="nav-line-2">& orders</p>
    </div>

    <div class="nav-cart border-white">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="cart-count">0</span>
      <p class="cart-text">Cart</p>
    </div>
  </header>

    



    <script src="./app.js"></script>
</body>
</html>
