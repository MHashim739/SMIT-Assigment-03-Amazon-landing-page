<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Landing Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-logo boeder-white">
      <div class="logo"></div>
    </div>

    <div class="nav-address border-white">
      <p class="add-first">Deliver to</p>
      <div class="add-icon">
        <i class="fa-solid fa-location-dot"></i>
        <p class="add-second">pakistan</p>
      </div>
    </div>

    <div class="nav-search">
      <select class="search-select">
        <option >ALL</option>
        <option value="">Arts & Crafts</option>
        <option value="">Automotive</option>
        <option value="">Baby</option>
        <option value="">Beauty & persnol Car</option>
        <option value="">Computer</option>
        <option value="">Deals</option>
        <option value="">Digital Service</option>
      </select>
      <input type="text" placeholder="Search Amazon" class="search-input">
      <div class="search-icon">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
    </div>

    <div class="nav-lang border-white">
      <img height="30px" width="50px" src="./images/download.jpg" alt="">
      <div class="flag-icon">US</div>
      <p class="lang-text">EN</p>
      <i class="fa-solid fa-caret-down dropdown-icon"></i>
       <div class="language-dropdown">

    <label>
      <input type="radio" name="language" checked>
      English - EN
    </label>

    <label>
      <input type="radio" name="language">
      Urdu - UR
    </label>

    <label>
      <input type="radio" name="language">
      Arabic - AR
    </label>

    <label>
      <input type="radio" name="language">
      Hindi - HI
    </label>
     <label>
      <input type="radio" name="language">
      expanol - ES
    </label>

  </div>

      </div>

      <div class="nav-signin border-white">
            <p class="nav-line-1" >Hello, sign in</p>
            <p class="nav-line-2">Account & Lists <i class="fa-solid fa-caret-down"></i></p>
             <div class="card" id="card">

        <button>Sign in</button>

        <p>
            New customer?
            <a href="#">Start here.</a>
        </p>

        <hr>

        <div class="card-content">

            <div>
                <h3>Your Lists</h3>

                <p>Create a List</p>
                <p>Find a List or Registry</p>
            </div>

            <div>
                <h3>Your Account</h3>

                <p>Account</p>
                <p>Orders</p>
                <p>Recommendations</p>
            </div>

        </div>

    </div>

</div>
        </div>
    </div>

    <div class="nav-orders border-white">
      <p class="nav-line-1">Returns</p>
      <p class="nav-line-2">& orders</p>
    </div>

    <div class="nav-cart border-white">
      <i class="fa-solid fa-cart-shopping"></i>
      <span class="cart-count">0</span>
      <p class="cart-text">Cart</p>
    </div>
  </header>

    



    <script src="./app.js"></script>
</body>
</html>
